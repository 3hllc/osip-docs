name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt
      - name: Install local PlantUML renderer
        run: sudo apt-get update && sudo apt-get install --yes plantuml
      - name: Render PlantUML diagrams
        run: |
          mkdir -p docs/en/assets/plantuml
          plantuml -tsvg -charset UTF-8 -o "$GITHUB_WORKSPACE/docs/en/assets/plantuml" diagrams/*.puml
          test -f docs/en/assets/plantuml/c4-system-context.svg
          test -f docs/en/assets/plantuml/c4-container-view.svg
      - name: Build documentation site
        run: |
          printf 'INHERIT: mkdocs.yml\nsite_url: "%s/"\n' "${{ steps.pages.outputs.base_url }}" > mkdocs-pages.yml
          mkdocs build --strict --config-file mkdocs-pages.yml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
