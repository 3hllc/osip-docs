name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-docs.lock
      - name: Install documentation dependencies
        run: pip install -r requirements-docs.lock
      - name: Check English/Russian translation parity
        run: python scripts/check_translation_parity.py
      - name: Install local PlantUML renderer
        run: sudo apt-get update && sudo apt-get install --yes plantuml
      - name: Render changed PlantUML diagrams
        run: python scripts/render_plantuml.py
      - name: Build documentation site
        env:
          NO_MKDOCS_2_WARNING: 'true'
        run: |
          printf 'INHERIT: mkdocs.yml\nsite_url: "%s/"\n' "${{ steps.pages.outputs.base_url }}" > mkdocs-pages.yml
          mkdocs build --strict --config-file mkdocs-pages.yml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
