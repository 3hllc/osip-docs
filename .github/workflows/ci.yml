name: Documentation checks

on:
  pull_request:

jobs:
  build-docs:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-docs.lock
      - name: Install documentation dependencies
        run: pip install -r requirements-docs.lock
      - name: Install local PlantUML renderer
        run: sudo apt-get update && sudo apt-get install --yes plantuml
      - name: Render changed PlantUML diagrams
        run: python scripts/render_plantuml.py
      - name: Build documentation strictly
        env:
          NO_MKDOCS_2_WARNING: 'true'
        run: mkdocs build --strict
