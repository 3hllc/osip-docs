name: Documentation checks

on:
  pull_request:

jobs:
  build-docs:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install documentation dependencies
        run: pip install mkdocs-material mkdocs-static-i18n
      - name: Install local PlantUML renderer
        run: sudo apt-get update && sudo apt-get install --yes plantuml
      - name: Render PlantUML diagrams
        run: |
          mkdir -p docs/en/assets/plantuml
          plantuml -tsvg -charset UTF-8 -o "$GITHUB_WORKSPACE/docs/en/assets/plantuml" diagrams/*.puml
          test -f docs/en/assets/plantuml/c4-system-context.svg
          test -f docs/en/assets/plantuml/c4-container-view.svg
      - name: Build documentation strictly
        run: mkdocs build --strict
