site_name: OSIP Knowledge Base
site_description: Canonical engineering knowledge base for the Open Spatial Intelligence Platform.
repo_name: OSIP
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal

extra_css:
  - assets/stylesheets/diagram-lightbox.css

extra_javascript:
  - assets/javascripts/diagram-lightbox.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mermaid2:
      javascript: assets/javascripts/mermaid.min.js
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: EN
          build: true
        - locale: ru
          name: RU
          build: true
          nav_translations:
            Home: Главная
            Foundation: Основа
            Overview: Обзор
            Project Charter: Устав проекта
            Vision: Видение
            Project Principles: Принципы проекта
            Project History: История проекта
            Glossary: Глоссарий
            Strategy: Стратегия
            Product Strategy: Продуктовая стратегия
            Roadmap: Дорожная карта
            Architecture: Архитектура
            Architecture Overview: Обзор архитектуры
            End-to-End Operating Model: Сквозная операционная модель
            Physical Asset Model: Модель физических активов
            Context Model: Модель контекста
            Domain Model: Доменная модель
            Event Model: Модель событий
            Device Model: Модель устройств
            Digital Twin: Цифровой двойник
            Message Bus: Шина сообщений
            Integration Providers: Провайдеры интеграций
            Constrained Spatial Reasoning Layer: Слой ограниченного пространственного рассуждения
            Intent, Policy, and Execution: Намерения, политики и исполнение
            Edge Runtime: Edge Runtime
            Fleet and Control Plane: Парк и control plane
            Zigbee Mesh and MQTT Bridge: Zigbee Mesh и MQTT-мост
            API Architecture: Архитектура API
            Security Architecture: Архитектура безопасности
            Deployment Architecture: Архитектура развёртывания
            Standards: Стандарты
            Documentation Standards: Стандарты документации
            Integration Standards: Стандарты интеграций
            ADR Process: Процесс ADR
            Diagram Standards: Стандарты диаграмм
            AI: ИИ
            AI Architecture: Архитектура ИИ
            AI Capability Roadmap: Дорожная карта возможностей ИИ
            AI Model Deployment Strategy: Стратегия развёртывания моделей ИИ
            Product: Продукт
            Commercial and Installer Edition Strategy: Коммерческая стратегия и Installer Edition
            Reference Designs: Референсные проекты
            Reference Apartment: Референсная квартира
            Reference Apartment Engineering Design: Инженерный проект референсной квартиры
            Operations: Эксплуатация
            Deployment and Recovery: Развёртывание и восстановление
            Monitoring and Observability: Мониторинг и наблюдаемость
            Installer Playbook: Руководство инсталлятора
            Collaboration: Совместная работа
            Knowledge: База знаний
            Open Questions: Открытые вопросы
